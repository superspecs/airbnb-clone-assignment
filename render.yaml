# Render Blueprint for the FastAPI backend (the frontend deploys separately on Vercel).
#
# FREE PLAN: no persistent disk. SQLite lives on the instance's ephemeral filesystem, so the
# database is recreated from seed data on every redeploy, restart, or wake-up after spin-down
# (free services sleep after 15 minutes without traffic). Fine for the read-only demo; booking
# and host changes will NOT persist.
#
# To persist data later (paid): set `plan: 0.5c-512mb`, add
#   disk: { name: sqlite-data, mountPath: /var/data, sizeGB: 1 }
# and set DATABASE_URL to sqlite:////var/data/app.db. Keep numInstances at 1 for SQLite.
services:
  - type: web
    name: airbnb-clone-assignment-api
    runtime: python
    rootDir: backend
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        value: sqlite:///./data/app.db
      - key: SEED_ON_STARTUP
        value: "true"
      - key: TIMEZONE
        value: Asia/Kolkata
      # Exact Vercel production origin (no trailing slash).
      - key: CORS_ORIGINS
        value: https://stays-demo.vercel.app
